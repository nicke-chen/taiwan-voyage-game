<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5上1-1｜從地圖探索位置與發展有何關聯？</title>
<link rel="stylesheet" href="app.css?v=1">
</head>
<body>
<main class="wrap">
  <section class="card hero">
    <div>
      <div class="eyebrow">五年級社會｜1-1</div>
      <h1>從地圖探索位置與發展有何關聯？</h1>
      <p>從世界位置、臺灣的海洋地理，到季風生活與生物遷徙，用三個章節把「位置如何影響發展」串起來。</p>
      <div class="identity">
        <input id="studentName" placeholder="姓名">
        <input id="studentClass" placeholder="班級">
        <input id="studentNo" placeholder="座號">
      </div>
    </div>
    <div class="heroVisual">
      <div class="globe">🌏</div>
      <div>🧭　🌊　🌬️　🐟　🦢</div>
    </div>
  </section>

  <section class="card" id="setup">
    <h2>選擇章節</h2>
    <div class="chapterGrid">
      <button class="chapterBtn active" data-chapter="1">
        <b>第一章｜世界與臺灣的位置</b>
        <span>五大洲、三大洋、福爾摩沙、臺灣位置與海洋國家</span>
      </button>
      <button class="chapterBtn" data-chapter="2">
        <b>第二章｜季風與生活</b>
        <span>東北季風、西南季風、氣候差異與生活適應</span>
      </button>
      <button class="chapterBtn" data-chapter="3">
        <b>第三章｜海洋生物遷徙</b>
        <span>寒暖流、烏魚、黑鮪魚、黑面琵鷺</span>
      </button>
      <button class="chapterBtn all" data-chapter="all">
        <b>三章總挑戰</b>
        <span>36 題混合複習</span>
      </button>
    </div>

    <h2>選擇模式</h2>
    <div class="modeGrid">
      <button class="modeBtn active" data-mode="learn"><b>📘 學習模式</b><span>提示＋即時回饋</span></button>
      <button class="modeBtn" data-mode="practice"><b>🧩 練習模式</b><span>題目與選項隨機</span></button>
      <button class="modeBtn" data-mode="test"><b>📝 測驗模式</b><span>不提示，最後計分</span></button>
    </div>
    <button id="startBtn" class="start">開始挑戰 →</button>
  </section>

  <section class="card hidden" id="game">
    <div class="topline">
      <span id="chapterLabel"></span>
      <span id="progressLabel"></span>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
    <h2 id="qTitle"></h2>
    <div class="meta"><span id="level"></span><span id="type"></span></div>
    <div class="memoryCard" id="memoryCard"></div>
    <div class="question" id="question"></div>
    <div id="answerArea"></div>
    <div id="feedback" class="feedback"></div>
    <div id="hint" class="hint"></div>
    <div class="actions">
      <button id="hintBtn" class="secondary">💡 提示</button>
      <button id="nextBtn" class="primary hidden">下一題 →</button>
    </div>
  </section>

  <section class="card hidden" id="result">
    <div class="resultTitle" id="resultTitle"></div>
    <p id="resultSummary"></p>
    <div class="reportGrid">
      <div><span>正確率</span><b id="accuracy"></b></div>
      <div><span>答對題數</span><b id="correctCount"></b></div>
      <div><span>錯題數</span><b id="wrongCount"></b></div>
    </div>
    <h3>錯題回顧</h3>
    <div id="review"></div>
    <button id="restartBtn" class="start">重新選擇章節</button>
  </section>
</main>
<script src="questions.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
