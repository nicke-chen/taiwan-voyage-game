<style>
:root{--ink:#18324a;--muted:#667b8b;--line:#cfe3ef;--blue:#1976d2;--green:#2e9b62;--gold:#f5b63c;--red:#d9534f;--bg:#edf9ff;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:linear-gradient(180deg,#e6f7ff 0,#fff8e8 100%);color:var(--ink)}
button,input{font:inherit}.wrap{max-width:980px;margin:auto;padding:14px}.card{background:rgba(255,255,255,.97);border:2px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(25,70,100,.07)}

.identity{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:14px}.identity input{padding:12px;border:1px solid #b9d4e3;border-radius:12px}.progress{height:14px;background:#e7eef3;border-radius:99px;overflow:hidden;margin-top:14px}.bar{height:100%;width:0;background:linear-gradient(90deg,#2795dd,#49b979);transition:.25s}
.chapter{font-weight:900;color:var(--blue);font-size:14px;margin-bottom:6px}.qtitle{font-size:clamp(24px,4.5vw,32px);margin:0;font-weight:950}.visual{margin:14px 0;border-radius:20px;overflow:hidden;border:2px solid #bcdbea;background:#f7fcff;aspect-ratio:2.28/1;min-height:0;position:relative}.visual img{position:absolute;left:0;top:-50%;width:100%;height:auto;max-height:none;display:block}.fallback{padding:28px;text-align:center;color:#527086;font-weight:850;line-height:1.6}.fallback .emoji{font-size:68px;display:block;margin-bottom:8px}.sourceTag{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.9);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;color:#4f6473}

.result{display:none}.result.show{display:block}.grade{font-size:clamp(30px,6vw,50px);font-weight:950}.certificate{padding:20px;border:4px double #d5b257;border-radius:18px;background:#fffdf4;text-align:center;margin:14px 0}.review{display:grid;gap:9px}.reviewItem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#f8fbfd}.badgeRow{display:flex;flex-wrap:wrap;gap:7px}.badge{padding:7px 10px;border:1px solid #bdd8e7;border-radius:999px;background:#eef7fc;font-weight:850}

</section>
</main>
<script>
const cards=Array.from({length:16},(_,k)=>`images/q${String(k+1).padStart(2,'0')}.png?v=2`);
const Q=[
{c:'單元 A｜大航海時代與臺灣的重要性',t:'第 1 關｜新航路來了',q:'西元 16 世紀，歐洲國家主要透過什麼方式來到亞洲？',o:['新航路','高速鐵路','空中航線','陸上公路'],a:0,h:'想一想：大航海時代最重要的交通工具是船。',ok:'16 世紀歐洲國家透過新航路來到亞洲。',emoji:'⛵🌍',cap:'新航路與世界航線',sheet:0},
{c:'單元 A｜大航海時代與臺灣的重要性',t:'第 2 關｜歐洲人想找什麼？',q:'歐洲國家來到亞洲，主要想尋找哪些商品？',o:['瓷器、絲綢、香料','牛奶、麵包、起司','石油、煤炭、天然氣','電腦、手機、晶片'],a:0,h:'看看青花瓷、布匹與香料這三種圖像。',ok:'瓷器、絲綢和香料都是當時重要的亞洲商品。',emoji:'🏺🧵🌶️',cap:'瓷器・絲綢・香料',sheet:0},
{c:'單元 A｜大航海時代與臺灣的重要性',t:'第 3 關｜臺灣為什麼重要？',q:'臺灣在大航海時代受到各方重視，最重要的原因是什麼？',o:['位在航運要道','山很多','冬天很冷','人口最多'],a:0,h:'想想船隻往來亞洲時，臺灣的位置有什麼優勢？',ok:'臺灣位在航運要道，使海上貿易交流更加頻繁。',emoji:'🚢🗺️🚢',cap:'臺灣位在航運要道',sheet:0},
{c:'單元 A｜大航海時代與臺灣的重要性',t:'第 4 關｜臺灣登上國際舞台',q:'因為臺灣位在航運要道，帶來哪一項結果？',o:['吸引各族群來臺建立據點','海上交通完全停止','沒有人願意來臺灣','臺灣與其他地區失去聯繫'],a:0,h:'航運越方便，往來的人通常會變多還是變少？',ok:'臺灣吸引不同族群來此活動與建立據點，逐漸登上國際舞台。',emoji:'🌏🤝⛵',cap:'各族群與商船來往',sheet:0},

{c:'單元 B｜當時有哪些人來到臺灣？',t:'第 7 關｜海商與海盜',q:'中國、日本的海商與海盜，常把臺灣當作什麼？',o:['貿易據點','首都','皇宮','軍事學校'],a:0,h:'這些人主要從事海上活動與交易。',ok:'中國、日本的海商與海盜曾以臺灣作為貿易據點。',emoji:'⛵📦⚓',cap:'海商、海盜與港口貿易',sheet:1},
{c:'單元 B｜當時有哪些人來到臺灣？',t:'第 8 關｜顏思齊、鄭芝龍',q:'顏思齊、鄭芝龍曾進行哪一項活動？',o:['招募漢人來臺開墾','建立熱蘭遮城','攻打鄭氏政權','把臺灣納入清帝國版圖'],a:0,h:'想想「顏思齊、鄭芝龍」和農田、開墾有什麼關係。',ok:'他們曾招募漢人來臺，在今日雲林、嘉義一帶開墾。',emoji:'👥🌾🐃',cap:'招募漢人來臺開墾',sheet:1},
{c:'單元 C｜四大勢力依序來臺',t:'第 9 關｜1624 荷蘭人來臺',q:'荷蘭人在西元 1624 年來臺後，以哪裡作為根據地？',o:['臺南','基隆','淡水','花蓮'],a:0,h:'荷蘭人的主要據點在臺灣南部。',ok:'荷蘭人以臺南為根據地。',emoji:'🇳🇱🏰⚓',cap:'荷蘭人在臺南',sheet:2},
{c:'單元 C｜四大勢力依序來臺',t:'第 10 關｜荷蘭人的建設與貿易',q:'下列哪一項是荷蘭人在臺灣進行的活動？',o:['建立熱蘭遮城、普羅民遮城','招募漢人開墾農田','與其他國家進行貿易','以上皆是'],a:3,h:'荷蘭人在臺活動不只一種，要把「建設、開墾、貿易」一起記。',ok:'荷蘭人在臺灣進行建設、開墾與貿易。',emoji:'🏰🌾🚢',cap:'熱蘭遮城・普羅民遮城・貿易',sheet:2},
{c:'單元 C｜四大勢力依序來臺',t:'第 11 關｜1626 西班牙人來臺',q:'西班牙人在西元 1626 年進入臺灣後，主要活動在哪一區？',o:['北部','南部','東部','中部'],a:0,h:'記憶口訣可以想：「西班牙—北部」。',ok:'西班牙人主要進入臺灣北部活動。',emoji:'🇪🇸🧭🏝️',cap:'西班牙人在臺灣北部',sheet:2},
{c:'單元 C｜四大勢力依序來臺',t:'第 12 關｜基隆與淡水',q:'西班牙人曾在哪兩個地方建立城堡，作為統治中心和貿易據點？',o:['基隆、淡水','臺南、高雄','嘉義、雲林','花蓮、臺東'],a:0,h:'這兩個地方都位在臺灣北部。',ok:'西班牙人在基隆、淡水建立城堡與據點。',emoji:'🏰基隆 ⚓ 淡水🏰',cap:'西班牙北部據點',sheet:2},
{c:'單元 D｜鄭氏政權與清帝國',t:'第 13 關｜1662 鄭成功來臺',q:'鄭成功在西元 1662 年來臺後，首先迫使哪一個勢力退出臺灣？',o:['荷蘭人','西班牙人','清帝國','日本海商'],a:0,h:'想想 1624 年來臺、在臺南建立據點的是誰。',ok:'鄭成功攻打荷蘭人，迫使荷蘭人退出臺灣。',emoji:'⚔️鄭 🚢 🇳🇱',cap:'鄭成功攻荷',sheet:3},
{c:'單元 D｜鄭氏政權與清帝國',t:'第 14 關｜承天府',q:'鄭成功來臺後，在臺南設立哪一個行政中心？',o:['承天府','熱蘭遮城','普羅民遮城','淡水城'],a:0,h:'這個名稱裡有一個「天」字。',ok:'鄭成功在臺南設立承天府，建立第一個在臺的漢人政權。',emoji:'🏯承天府',cap:'臺南承天府',sheet:3},
{c:'單元 D｜鄭氏政權與清帝國',t:'第 15 關｜1684 臺灣納入清帝國',q:'鄭經過世後，鄭氏政權內部紛爭不斷，清帝國派誰帶兵進攻臺灣？',o:['施琅','鄭成功','顏思齊','鄭芝龍'],a:0,h:'找出屬於清帝國一方的人物。',ok:'清帝國派施琅帶兵進攻臺灣。',emoji:'🚩清 ⚓ 施琅',cap:'清帝國統治臺灣',sheet:3},
{c:'單元 D｜綜合應用',t:'第 16 關｜最終 Boss：荷西鄭清時間軸',q:'請依照時間先後，把四個事件排出正確順序。',o:[],a:0,h:'記憶口訣：「航運要道最重要，荷西鄭清依序到。」',ok:'正確順序：1624 荷蘭 → 1626 西班牙 → 1662 鄭成功 → 1684 清帝國。',emoji:'1624 → 1626 → 1662 → 1684',cap:'荷西鄭清時間軸',sheet:3,type:'timeline'}

let i=0,score=0,first=0;const attempts=Array(16).fill(0),usedHint=Array(16).fill(false),mistakes=new Set(),answered=Array(16).fill(false),letters=['A','B','C','D'];
const $=id=>document.getElementById(id);
function renderVisual(q){const box=$('visual');box.innerHTML='';const img=new Image();img.src=cards[i];img.alt=q.cap;img.onload=()=>{box.innerHTML='';box.appendChild(img);const tag=document.createElement('span');tag.className='sourceTag';tag.textContent='圖像 '+String(i+1).padStart(2,'0')+'/16';box.appendChild(tag)};img.onerror=()=>{box.innerHTML=`<div class="fallback"><span class="emoji">${q.emoji}</span>${q.cap}<br><span class="small">題卡圖片尚未載入時會顯示此備援圖示</span></div>`}}
function render(){if(i>=16){finish();return}const q=Q[i];$('game').classList.remove('hidden');$('result').classList.remove('show');$('chapter').textContent=q.c;$('qtitle').textContent=q.t;$('qtext').textContent=q.q;$('stageStat').textContent=(i+1)+'/16';$('scoreStat').textContent=score;$('firstStat').textContent=first;$('bar').style.width=(i/16*100)+'%';$('feedback').textContent='';$('hintbox').textContent=q.h;$('hintbox').classList.remove('show');$('hintBtn').disabled=answered[i];$('nextBtn').classList.toggle('hidden',!answered[i]);$('nextBtn').textContent=i===15?'查看結果 →':'下一關 →';$('prevBtn').disabled=i===0;renderVisual(q);$('choices').innerHTML='';$('timeline').innerHTML='';$('timeline').classList.add('hidden');$('track').classList.add('hidden');
if(q.type==='timeline'){renderTimeline(q)}else{q.o.forEach((opt,idx)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="letter">${letters[idx]}</span>${opt}`;if(answered[i]){b.disabled=true;if(idx===q.a)b.classList.add('correct')}b.onclick=()=>choose(idx,b,q);$('choices').appendChild(b)})}}
function choose(idx,b,q){if(answered[i])return;attempts[i]++;if(idx===q.a){answered[i]=true;b.classList.add('correct');document.querySelectorAll('.choice').forEach(x=>x.disabled=true);let pts=usedHint[i]?2:(attempts[i]===1?5:3);score+=pts;if(attempts[i]===1&&!usedHint[i])first++;$('feedback').textContent='✅ '+q.ok+'（+'+pts+' 分）';$('nextBtn').classList.remove('hidden');$('hintBtn').disabled=true}else{b.classList.add('wrong');mistakes.add(i);$('feedback').textContent='❌ 再想一下，可以使用提示後再答。';setTimeout(()=>b.classList.remove('wrong'),700)}$('scoreStat').textContent=score;$('firstStat').textContent=first}
function renderTimeline(q){$('timeline').classList.remove('hidden');$('track').classList.remove('hidden');$('choices').innerHTML='';const vals=[['1662','鄭成功'],['1624','荷蘭'],['1684','清帝國'],['1626','西班牙']];const order=[];$('track').textContent=answered[i]?'1624 荷蘭 → 1626 西班牙 → 1662 鄭成功 → 1684 清帝國':'你的排序：尚未開始';vals.forEach(v=>{const b=document.createElement('button');b.className='order';b.innerHTML=v[0]+'<br>'+v[1];if(answered[i])b.disabled=true;b.onclick=()=>{if(answered[i]||b.classList.contains('selected'))return;order.push(v[0]);b.classList.add('selected');$('track').textContent='你的排序：'+order.join(' → ');if(order.length===4){attempts[i]++;const correct=order.join(',')==='1624,1626,1662,1684';if(correct){answered[i]=true;let pts=usedHint[i]?2:(attempts[i]===1?20:12);score+=pts;if(attempts[i]===1&&!usedHint[i])first++;$('feedback').textContent='🏆 '+q.ok+'（Boss 獎勵 +'+pts+' 分）';document.querySelectorAll('.order').forEach(x=>x.disabled=true);$('nextBtn').classList.remove('hidden');$('hintBtn').disabled=true}else{mistakes.add(i);$('feedback').textContent='❌ 順序不對，再試一次。';setTimeout(()=>{order.length=0;document.querySelectorAll('.order').forEach(x=>x.classList.remove('selected'));$('track').textContent='你的排序：重新開始'},700)}}};$('timeline').appendChild(b)})}
$('hintBtn').onclick=()=>{usedHint[i]=true;$('hintbox').classList.add('show')};$('nextBtn').onclick=()=>{i++;render();window.scrollTo({top:0,behavior:'smooth'})};$('prevBtn').onclick=()=>{if(i>0){i--;render();window.scrollTo({top:0,behavior:'smooth'})}};
function finish(){$('game').classList.add('hidden');$('result').classList.add('show');$('bar').style.width='100%';$('stageStat').textContent='16/16';const max=95;const pct=Math.round(score/max*100);let g=pct>=90?'🌟 航海王':pct>=75?'⛵ 航海高手':pct>=60?'🧭 航海小尖兵':'🗺️ 再挑戰一次';$('grade').textContent=g;$('summary').textContent=`總分 ${score}/${max}（${pct}%），第一次且未使用提示答對 ${first}/16。`;$('certName').textContent=`${$('studentClass').value||'____班'} ${$('studentNo').value||'__號'} ${$('studentName').value||'________'} 同學`;$('certScore').textContent=`成績：${score}/${max}`;$('badges').innerHTML=`<span class="badge">首次答對 ${first}</span><span class="badge">錯題 ${mistakes.size}</span><span class="badge">完成 16 關</span>`;const r=$('review');r.innerHTML='';if(!mistakes.size)r.innerHTML='<div class="reviewItem">🎉 沒有錯題，全部一次通關！</div>';else[...mistakes].forEach(n=>{const q=Q[n],d=document.createElement('div');d.className='reviewItem';d.innerHTML=`<b>${q.t}</b><br>${q.ok}`;r.appendChild(d)});const gbox=$('sheetGallery');gbox.innerHTML='';cards.forEach((src,k)=>{const im=new Image();im.src=src;im.alt=`題卡 ${String(k+1).padStart(2,'0')}`;im.onerror=()=>im.remove();gbox.appendChild(im)});window.scrollTo({top:0,behavior:'smooth'})}
$('restartBtn').onclick=()=>location.reload();render();
</script>
</body></html>
